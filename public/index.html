<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratchboard</title>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<link rel="stylesheet" href="/vendor/xterm.css">
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --surface-2: #efede8; --line: #dedad2;
  --text: #1d1c1a; --muted: #6b675f; --faint: #9a958b;
  --accent: #2f5bd3; --ready: #1f7a4d; --ready-bg: #e3f2ea; --blocked: #8a6a1f; --blocked-bg: #f6eed9;
  --progress: #2f5bd3; --progress-bg: #e6ecfb; --danger: #b3261e; --danger-bg: #fbe7e5;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412; --surface: #1d1c1a; --surface-2: #262522; --line: #34322e;
    --text: #ecebe7; --muted: #a29e95; --faint: #6f6b63;
    --accent: #7c9cff; --ready: #5cc995; --ready-bg: #17321f; --blocked: #d9b45c; --blocked-bg: #33290f;
    --progress: #7c9cff; --progress-bg: #1b2440; --danger: #ff8a80; --danger-bg: #3a1714;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
header .repo { font-family: var(--mono); color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.live.on i { background: var(--ready); box-shadow: 0 0 0 3px var(--ready-bg); }
label.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); cursor: pointer; }
main { padding: 16px 20px 60px; display: grid; gap: 24px; }
.lane h2 { font-size: 14px; margin: 0 0 2px; font-weight: 650; }
.lane h2[data-key] { cursor: pointer; }
.lane h2[data-key]:hover { color: var(--accent); }
.mapbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -4px 0 10px; }
.mapbar .note { font-size: 12px; color: var(--muted); }
.lane .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; font-family: var(--mono); }
.cols { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.col { background: var(--surface-2); border-radius: 10px; padding: 8px; min-height: 90px; border: 1px dashed transparent; transition: border-color .12s, background .12s; }
.col.drop-ok { border-color: var(--accent); background: var(--progress-bg); }
.col h3 { margin: 2px 4px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; display: flex; justify-content: space-between; }
.col .hint { font-size: 12px; color: var(--faint); padding: 6px 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; box-shadow: var(--shadow); cursor: pointer; }
.card:hover { border-color: var(--faint); }
.card[draggable="true"] { cursor: grab; }
.card.dragging { opacity: .45; }
.card.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
.card .top { display: flex; gap: 8px; align-items: baseline; }
.card .id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.card .title { font-weight: 550; flex: 1; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.chip.ready { background: var(--ready-bg); color: var(--ready); }
.chip.wait { background: var(--blocked-bg); color: var(--blocked); }
.chip.run { background: var(--progress-bg); color: var(--progress); }
.chip.run::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 5px; vertical-align: 1px; animation: pulse 1.6s infinite; }
.chip.ended, .chip.warn { background: var(--danger-bg); color: var(--danger); }
@keyframes pulse { 50% { opacity: .35; } }
.actions { display: flex; gap: 6px; margin-top: 8px; }
button { font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
button:hover { border-color: var(--faint); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.quiet { font-size: 11px; padding: 2px 7px; color: var(--muted); }
button:disabled { opacity: .5; cursor: default; }
.mini { display: flex; gap: 8px; padding: 4px 6px; font-size: 12px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.mini:hover { background: var(--surface); color: var(--text); }
.mini .id { font-family: var(--mono); }
.mini.selected { background: var(--surface); color: var(--text); }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.08); transform: translateX(100%); transition: transform .18s ease; z-index: 10; display: flex; flex-direction: column; }
aside.open { transform: none; }
aside.wide { width: min(980px, 100vw); }
aside .tabs { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); }
aside .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; color: var(--muted); }
aside .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
aside .tabs button:disabled { opacity: .4; }
aside .term { flex: 1; min-height: 0; padding: 8px; background: #111; display: none; }
aside .term.on { display: block; }
aside .term .note { color: #aaa; font: 13px var(--sans); padding: 12px; }
aside .bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
aside .bar .path { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
aside .rel { padding: 10px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; font-size: 12px; }
aside .rel b { color: var(--muted); font-weight: 600; margin-right: 6px; }
aside .rel a { color: var(--accent); cursor: pointer; text-decoration: none; margin-right: 8px; font-family: var(--mono); }
aside .doc { padding: 4px 20px 40px; overflow: auto; flex: 1; }
.doc h1 { font-size: 19px; } .doc h2 { font-size: 15px; margin-top: 22px; } .doc table { border-collapse: collapse; font-size: 12px; }
.doc td, .doc th { border: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
.doc code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
.doc pre { background: var(--surface-2); padding: 10px; border-radius: 6px; overflow: auto; }
.doc a { color: var(--accent); }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
#toast.show { opacity: 1; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
@media (max-width: 1100px) { .cols { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .cols { grid-template-columns: 1fr; } main, header { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Scratchboard</h1>
  <span class="repo" id="repo"></span>
  <span class="spacer"></span>
  <label class="toggle"><input type="checkbox" id="hideDone"> Hide resolved Features</label>
  <span class="live" id="live"><i></i><span>connecting</span></span>
</header>
<main id="board"><div class="empty">Loading…</div></main>
<aside id="panel">
  <div class="bar"><span class="path" id="pPath"></span><span id="pActions"></span><button id="pClose" title="Close">✕</button></div>
  <div class="tabs" id="pTabs"><button data-tab="ticket" class="on">Ticket</button><button data-tab="session">Session</button></div>
  <div class="rel" id="pRel"></div>
  <div class="doc" id="pDoc"></div>
  <div class="term" id="pTerm"></div>
</aside>
<div id="toast"></div>
<script>
const COLS = [['blocked', 'Blocked'], ['ready', 'Ready'], ['grilling', 'Grilling'], ['in-progress', 'In progress'], ['resolved', 'Resolved']];
const CLAIMED = ['grilling', 'in-progress'];
// Which drags are allowed, and what each one does.
const MOVES = { 'ready>grilling': 'grill', 'ready>in-progress': 'launch', 'grilling>in-progress': 'launch', 'grilling>ready': 'release', 'in-progress>ready': 'release' };
let board = null;
let selected = null;
let dragKey = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

$('hideDone').checked = store.get('sb.hideDone') === '1';
$('hideDone').onchange = (e) => { store.set('sb.hideDone', e.target.checked ? '1' : '0'); render(); };

function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => setLive(true);
  es.onmessage = (e) => { board = JSON.parse(e.data); render(); if (selected) refreshPanel(false); };
  // Sent instead of OS notifications where the OS has none we can use (Windows).
  es.addEventListener('notify', (e) => {
    const { title, body } = JSON.parse(e.data);
    if (window.Notification?.permission === 'granted') new Notification(title, { body });
    else toast(`${title}: ${body}`);
  });
  es.onerror = () => setLive(false);
}
function setLive(on) { $('live').classList.toggle('on', on); $('live').querySelector('span').textContent = on ? 'live' : 'reconnecting'; }

function allTickets() { return board ? board.features.flatMap((f) => f.tickets.map((t) => ({ ...t, feature: f.slug }))) : []; }
function byKey(key) { return allTickets().find((t) => t.key === key); }

function render() {
  if (!board) return;
  $('repo').textContent = board.repoRoot;
  document.title = `Scratchboard · ${board.repo}`;
  const hide = $('hideDone').checked;
  // A lane with a Map stays in view: there's always a Map Session to offer on it.
  const lanes = board.features.filter((f) => !hide || f.hasMap || f.tickets.some((t) => t.column !== 'resolved'));
  if (!lanes.length) { $('board').innerHTML = `<div class="empty">No Tickets in <code>.scratch/*/issues/</code> and no <code>.scratch/*/map.md</code>${hide ? ' that are still open' : ''}.</div>`; return; }
  $('board').innerHTML = lanes.map(lane).join('');
  for (const el of document.querySelectorAll('[data-key]')) {
    el.onclick = (e) => { if (e.target.closest('button')) return; openPanel(el.dataset.key); };
    el.ondragstart = (e) => { dragKey = el.dataset.key; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragKey); };
    el.ondragend = () => { dragKey = null; el.classList.remove('dragging'); document.querySelectorAll('.drop-ok').forEach((c) => c.classList.remove('drop-ok')); };
  }
  for (const col of document.querySelectorAll('.col')) {
    col.ondragover = (e) => { if (canDrop(col)) { e.preventDefault(); col.classList.add('drop-ok'); } };
    col.ondragleave = () => col.classList.remove('drop-ok');
    col.ondrop = (e) => { e.preventDefault(); col.classList.remove('drop-ok'); onDrop(col); };
  }
  for (const b of document.querySelectorAll('button[data-act]')) b.onclick = () => doAction(b.dataset.act, b.dataset.for);
  for (const b of document.querySelectorAll('button[data-map-act]')) b.onclick = () => doMapAction(b.dataset.mapAct, b.dataset.slug);
}

function lane(f) {
  const counts = Object.fromEntries(COLS.map(([c]) => [c, f.tickets.filter((t) => t.column === c).length]));
  return `<section class="lane">
    <h2 ${f.hasMap ? `data-key="${esc(f.mapKey)}" title="Show the Map"` : ''}>${esc(f.mapTitle ?? f.slug)}</h2>
    <div class="sub">.scratch/${esc(f.slug)} · ${counts.ready} ready · ${counts.grilling} grilling · ${counts['in-progress']} in progress · ${counts.resolved}/${f.tickets.length} resolved</div>
    ${mapBar(f)}
    <div class="cols">${COLS.map(([c, label]) => `
      <div class="col" data-col="${c}" data-feature="${esc(f.slug)}">
        <h3><span>${label}</span><span>${counts[c]}</span></h3>
        ${f.tickets.filter((t) => t.column === c).map((t) => c === 'resolved' ? mini(t) : card(t)).join('')}
        ${c === 'grilling' && !counts[c] && counts.ready ? '<div class="hint">Drag a Ready Ticket here to grill it with /grill-me</div>' : ''}
        ${c === 'in-progress' && !counts[c] && (counts.ready || counts.grilling) ? '<div class="hint">Drag a Ticket here to build it with /implement</div>' : ''}
      </div>`).join('')}
    </div></section>`;
}

// --- Map Sessions: chart (/wayfinder) and slice (/to-tickets) ---
const MAP_SKILLS = { chart: 'Chart with /wayfinder', slice: 'Slice with /to-tickets' };
const MAP_HINTS = {
  chart: (f) => f.tickets.length ? 'The Map has Fog to turn into Decision Tickets.' : 'This Map has no Tickets yet.',
  slice: () => 'Every decision is made: slice the Map into Build Tickets.',
};
function byMap(key) { return board?.features.find((f) => f.hasMap && f.mapKey === key) ?? null; }

function mapBar(f) {
  if (!f.hasMap) return '';
  return `<div class="mapbar">${mapControls(f, true)}</div>`;
}

function mapControls(f, withHint) {
  const s = esc(f.slug);
  if (f.mapBusy) return '<span class="chip">working…</span>';
  const out = [];
  const ms = f.mapSession;
  const kind = ms?.kind ? `${ms.kind} Session` : 'Map Session';
  if (ms?.status === 'running') {
    out.push(`<span class="chip run">${kind} running</span>`);
    out.push(`<button data-map-act="open" data-slug="${s}">Open</button>`, `<button data-map-act="stopMap" data-slug="${s}">Stop</button>`);
    return out.join('');
  }
  if (ms?.status === 'ended') {
    out.push(`<span class="chip ended">${kind} ended</span>`, `<button data-map-act="open" data-slug="${s}">Open</button>`);
    if (ms.canRelaunch) out.push(`<button data-map-act="relaunchMap" data-slug="${s}">Relaunch</button>`);
    out.push(`<button data-map-act="stopMap" data-slug="${s}">Close</button>`);
  }
  // The main action first, then the other skill in case the board's guess is wrong.
  const order = f.mapAction === 'slice' ? ['slice', 'chart'] : ['chart', 'slice'];
  for (const k of order) out.push(`<button data-map-act="${k}" data-slug="${s}" class="${k === f.mapAction ? 'primary' : f.mapAction ? 'quiet' : ''}">${MAP_SKILLS[k]}</button>`);
  if (withHint && f.mapAction && !ms) out.push(`<span class="note">${esc(MAP_HINTS[f.mapAction](f))}</span>`);
  return out.join('');
}

async function doMapAction(act, slug) {
  const f = board.features.find((x) => x.slug === slug);
  if (!f) return;
  const name = f.mapTitle ?? f.slug;
  if (act === 'stopMap' && f.mapSession?.status === 'running' && !confirm(`Stop the ${f.mapSession.kind ?? 'Map'} Session on ${name}? Its window is closed.`)) return;
  if ((act === 'chart' || act === 'slice') && f.mapAction && act !== f.mapAction && !confirm(`The board suggests ${MAP_SKILLS[f.mapAction]} for ${name}. Start ${MAP_SKILLS[act]} anyway?`)) return;
  try {
    const body = act === 'open' ? { key: f.mapKey } : { slug };
    const res = await fetch(`/api/${act}`, { method: 'POST', headers: { 'content-type': 'application/json', 'x-scratchboard': '1' }, body: JSON.stringify(body) });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error);
    if (!board.nativeNotifications && window.Notification?.permission === 'default') Notification.requestPermission();
    const where = board.backend.label;
    toast({ chart: `Charting ${name}: /wayfinder starting in ${where}. Press Open to join`, slice: `Slicing ${name}: /to-tickets starting in ${where}. Press Open to join`, relaunchMap: `Relaunched the Session on ${name}`, stopMap: `Closed the Session on ${name}`, open: out.inBrowser ? '' : `Opening ${name}'s Session in a terminal` }[act] || '');
    if (out.inBrowser || ((act === 'chart' || act === 'slice') && board.backend.inBrowser)) { await openPanel(f.mapKey); showTab('session'); }
    if (act === 'relaunchMap' && selected === f.mapKey && tab === 'session') connectTerm(f.mapKey);
  } catch (err) { toast(`Couldn't ${act} ${name}: ${err.message}`); }
}

function mini(t) {
  return `<div class="mini ${selected === t.key ? 'selected' : ''}" data-key="${esc(t.key)}"><span class="id">${esc(t.id)}</span><span>${esc(t.title)}</span></div>`;
}

function card(t) {
  const draggable = !t.busy && ['ready', ...CLAIMED].includes(t.column);
  return `<div class="card ${selected === t.key ? 'selected' : ''}" data-key="${esc(t.key)}" draggable="${draggable}">
    <div class="top"><span class="id">${esc(t.id)}</span><span class="title">${esc(t.title)}</span></div>
    <div class="meta">${chips(t)}</div>
    ${actionsFor(t)}
  </div>`;
}

function chips(t) {
  const out = [];
  if (t.type) out.push(`<span class="chip">${esc(t.type)}</span>`);
  if (t.needsInfo) out.push('<span class="chip wait">needs info</span>');
  if (t.readyForHuman) out.push('<span class="chip">ready for human</span>');
  if (t.column === 'blocked' && t.waitingOn.length) out.push(`<span class="chip wait">waits on ${t.waitingOn.map(esc).join(', ')}</span>`);
  if (t.readyForAgent && t.column === 'grilling') out.push('<span class="chip ready">grilled · ready for agent</span>');
  else if (t.readyForAgent && t.column === 'ready') out.push('<span class="chip ready">ready for agent</span>');
  else if (t.column === 'ready') out.push('<span class="chip ready">ready</span>');
  if (t.busy) out.push('<span class="chip">working…</span>');
  else if (t.session === 'running') out.push(`<span class="chip run">${t.column === 'grilling' ? 'grill Session running' : 'Session running'}</span>`);
  else if (t.session === 'ended' && CLAIMED.includes(t.column)) out.push('<span class="chip ended">Session ended</span>');
  else if (t.session === 'person') out.push(`<span class="chip">claimed: ${esc(t.assignee)}</span>`);
  for (const w of t.warnings) out.push(`<span class="chip warn" title="${esc(w)}">⚠ ${esc(w)}</span>`);
  return out.join('');
}

function actionsFor(t) {
  if (t.busy) return '';
  const k = esc(t.key);
  // A resolved Ticket's Session window may still be open: let it be reached.
  if (!CLAIMED.includes(t.column)) return t.session === 'running' || t.session === 'ended' ? `<div class="actions"><button data-act="open" data-for="${k}">Open Session</button></div>` : '';
  const btns = [];
  if (t.session === 'running' || t.session === 'ended') btns.push(`<button data-act="open" data-for="${k}">Open</button>`);
  if (t.session === 'ended' && t.sessionId) btns.push(`<button data-act="relaunch" data-for="${k}">Relaunch</button>`);
  btns.push(`<button data-act="release" data-for="${k}">Release</button>`);
  return `<div class="actions">${btns.join('')}</div>`;
}

function moveFor(col) {
  const t = dragKey && byKey(dragKey);
  if (!t || col.dataset.feature !== t.feature) return null;
  return MOVES[`${t.column}>${col.dataset.col}`] ?? null;
}
function canDrop(col) { return Boolean(moveFor(col)); }
function onDrop(col) { const act = moveFor(col); if (act) doAction(act, dragKey); }

async function doAction(act, key) {
  const t = byKey(key);
  if (act === 'launch' && t.column === 'grilling') {
    const msg = (t.readyForAgent ? '' : `${t.id} isn't marked ready-for-agent yet, so the grill Session may not have written its Agent Brief.\n\n`)
      + (t.session === 'running' ? 'Its grill Session is still open and will be closed.\n\n' : '')
      + `Start /implement on ${t.id}?`;
    if ((!t.readyForAgent || t.session === 'running') && !confirm(msg)) return;
  }
  if (act === 'release') {
    const msg = t.session === 'running'
      ? `Release ${t.id}? Its Session is still running, and releasing closes its tmux window.`
      : t.session === 'person' ? `Release ${t.id}? It's claimed by "${t.assignee}". Releasing clears that claim.` : `Release ${t.id} back to Ready?`;
    if (!confirm(msg)) return;
  }
  try {
    const res = await fetch(`/api/${act}`, { method: 'POST', headers: { 'content-type': 'application/json', 'x-scratchboard': '1' }, body: JSON.stringify({ key }) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error);
    if (!board.nativeNotifications && window.Notification?.permission === 'default') Notification.requestPermission();
    const where = board.backend.label;
    toast({ grill: `Grilling ${t.id}: /grill-me starting in ${where}. Press Open to join`, launch: `Building ${t.id}: /implement starting in ${where}`, release: `Released ${t.id}`, relaunch: `Relaunched ${t.id}`, open: body.inBrowser ? '' : `Opening ${t.id} in a terminal` }[act] || '');
    if (act === 'open' && body.inBrowser) { await openPanel(key); showTab('session'); }
    if (act === 'relaunch' && selected === key && tab === 'session') connectTerm(key);
  } catch (err) { toast(`Couldn't ${act} ${t?.id ?? ''}: ${err.message}`); }
}

let toastTimer;
function toast(msg) { if (!msg) return; const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3500); }

async function openPanel(key) {
  if (key !== selected) { disconnectTerm(); showTab('ticket'); }
  selected = key; render(); $('panel').classList.add('open'); await refreshPanel(true);
}
let lastMd = null;
async function refreshPanel(force) {
  const t = byKey(selected);
  const f = t ? null : byMap(selected);
  if (!t && !f) return closePanel();
  $('pTabs').querySelector('[data-tab="ticket"]').textContent = f ? 'Map' : 'Ticket';
  if (f) return refreshMapPanel(f, force);
  const link = (id) => { const x = allTickets().find((y) => y.feature === t.feature && y.id === id); return x ? `<a data-goto="${esc(x.key)}" title="${esc(x.title)}">${esc(id)}${x.column === 'resolved' ? ' ✓' : ''}</a>` : esc(id); };
  $('pRel').innerHTML = `
    <div><b>Column</b>${esc(COLS.find(([c]) => c === t.column)[1])}${t.statusRaw ? ` · Status: ${esc(t.statusRaw)}` : ''}${t.assignee ? ` · ${esc(t.assignee)}` : ''}</div>
    <div><b>Blocked by</b>${t.blockerIds.length ? t.blockerIds.map(link).join('') : 'nothing'}</div>
    <div><b>Blocks</b>${t.blocks.length ? t.blocks.map(link).join('') : 'nothing'}</div>
    ${t.session && t.session !== 'person' ? `<div><b>Session</b>${t.session}${t.sessionId ? ` · <code>${esc(t.sessionId)}</code>` : ''}</div>` : ''}`;
  for (const a of $('pRel').querySelectorAll('[data-goto]')) a.onclick = () => openPanel(a.dataset.goto);
  // The Session tab shows the live terminal when Scratchboard runs Sessions itself (pty backend).
  const hasTerm = board.backend.inBrowser && (t.session === 'running' || t.session === 'ended');
  $('pTabs').style.display = board.backend.inBrowser ? '' : 'none';
  $('pTabs').querySelector('[data-tab="session"]').disabled = !hasTerm;
  if (tab === 'session' && termKey !== selected && hasTerm) connectTerm(selected);
  $('pActions').innerHTML = actionsFor(t).replace('class="actions"', 'class="actions" style="margin:0"');
  for (const b of $('pActions').querySelectorAll('button[data-act]')) b.onclick = () => doAction(b.dataset.act, b.dataset.for);
  await loadDoc(force, 'Could not load the Ticket.');
}
async function loadDoc(force, failure) {
  try {
    const res = await fetch(`/api/ticket?key=${encodeURIComponent(selected)}`);
    const { markdown, path } = await res.json();
    if (!force && markdown === lastMd) return;
    lastMd = markdown;
    $('pPath').textContent = path;
    $('pDoc').innerHTML = window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(markdown)) : `<pre>${esc(markdown)}</pre>`;
  } catch { $('pDoc').textContent = failure; }
}
async function refreshMapPanel(f, force) {
  const ms = f.mapSession;
  $('pRel').innerHTML = `
    <div><b>Map</b>${f.tickets.length} Tickets · ${f.hasFog ? 'has Fog' : 'no Fog'}${f.mapAction ? ` · suggests ${esc(MAP_SKILLS[f.mapAction])}` : ''}</div>
    ${ms ? `<div><b>Session</b>${esc(ms.kind ?? 'Map')} · ${esc(ms.status)}</div>` : ''}`;
  const hasTerm = board.backend.inBrowser && Boolean(ms);
  $('pTabs').style.display = board.backend.inBrowser ? '' : 'none';
  $('pTabs').querySelector('[data-tab="session"]').disabled = !hasTerm;
  if (tab === 'session' && termKey !== selected && hasTerm) connectTerm(selected);
  $('pActions').innerHTML = `<span class="actions" style="margin:0">${mapControls(f, false)}</span>`;
  for (const b of $('pActions').querySelectorAll('button[data-map-act]')) b.onclick = () => doMapAction(b.dataset.mapAct, b.dataset.slug);
  await loadDoc(force, 'Could not load the Map.');
}

function closePanel() { disconnectTerm(); showTab('ticket'); selected = null; lastMd = null; $('panel').classList.remove('open'); render(); }
$('pClose').onclick = closePanel;
// Escape belongs to the Session when you're typing in its terminal.
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !e.target.closest('#pTerm')) closePanel(); });

// --- Session terminal (pty backend) ---
let tab = 'ticket';
let term = null, fit = null, sock = null, termKey = null;
for (const b of $('pTabs').querySelectorAll('button')) b.onclick = () => showTab(b.dataset.tab);
function showTab(name) {
  tab = name;
  for (const b of $('pTabs').querySelectorAll('button')) b.classList.toggle('on', b.dataset.tab === name);
  const session = name === 'session';
  $('panel').classList.toggle('wide', session);
  $('pRel').style.display = $('pDoc').style.display = session ? 'none' : '';
  $('pTerm').classList.toggle('on', session);
  if (session && selected && termKey !== selected) connectTerm(selected);
  if (session) setTimeout(() => { fitTerm(); term?.focus(); }, 200);
}
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function connectTerm(key) {
  disconnectTerm();
  termKey = key;
  $('pTerm').innerHTML = '';
  term = new Terminal({ fontFamily: cssVar('--mono'), fontSize: 13, cursorBlink: true, scrollback: 5000, theme: { background: '#111111' } });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($('pTerm'));
  sock = new WebSocket(`ws://${location.host}/api/term?key=${encodeURIComponent(key)}`);
  const s = sock;
  s.onopen = () => fitTerm();
  s.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'data') term.write(m.data);
    else if (m.type === 'reset') term.reset();
    else if (m.type === 'exit') term.write('\r\n\x1b[2m[Session ended. Relaunch resumes the conversation.]\x1b[0m\r\n');
    else if (m.type === 'gone') term.write('\r\n\x1b[2m[No running Session for this Ticket. Relaunch resumes the conversation.]\x1b[0m\r\n');
  };
  term.onData((data) => { if (s.readyState === 1) s.send(JSON.stringify({ type: 'input', data })); });
}
function fitTerm() {
  if (!term || !fit || tab !== 'session') return;
  try { fit.fit(); } catch { return; }
  if (sock?.readyState === 1) sock.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
}
function disconnectTerm() { sock?.close(); term?.dispose(); sock = term = fit = termKey = null; }
new ResizeObserver(() => fitTerm()).observe($('pTerm'));

connect();
</script>
